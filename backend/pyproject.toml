[project]
name = "edt"
version = "0.1.0"
description = "Earth Digital Twin - Trend Detective: data pipeline, statistics and API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
    "xarray>=2026.9.0",
    "zarr>=3.4.2",
]

[project.scripts]
edt = "edt.pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "openapi-core>=0.23.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
